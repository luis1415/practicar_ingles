[project]
name = "entrevistas-en-ingles"
version = "0.1.0"
description = "Practica entrevistas en inglés: graba, transcribe y recibe correcciones"
readme = "README.md"
authors = [
    { name = "luis1415", email = "luisbermudeztorres@gmail.com" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "customtkinter>=6.0.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "sounddevice>=0.5.6",
]


[project.scripts]
practice = "interview_coach.cli:main"
tutor = "interview_coach.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_coach"]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle (PEP 8)
    "F",       # pyflakes
    "I",       # orden de imports
    "N",       # nombres PEP 8
    "D",       # docstrings (PEP 257)
    "UP",      # sintaxis moderna de Python
    "B",       # bugs comunes
    "ANN",     # anotaciones de tipo
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper", "customtkinter"]
ignore_missing_imports = true

# customtkinter has no type information, so its widgets count as Any.
[[tool.mypy.overrides]]
module = "interview_coach.gui.*"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
